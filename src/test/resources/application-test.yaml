spring:
  datasource:
    # One database per test context, so contexts never see each other's schema.
    url: jdbc:h2:mem:test-${random.uuid};MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
  liquibase:
    contexts: dev
  jpa:
    hibernate:
      # Fails the tests when an entity and the Liquibase schema disagree.
      ddl-auto: validate

samvaer:
  auth:
    mode: stub
